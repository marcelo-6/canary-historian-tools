name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache PowerShell modules
        id: cache-powershell-modules
        uses: actions/cache@v5
        with:
          path: ~/Documents/PowerShell/Modules
          key: ${{ runner.os }}-powershell-7-modules-PSScriptAnalyzer-1.25.0-Pester-5.9.0

      - name: Install PowerShell test modules
        if: steps.cache-powershell-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force

      - name: Validate release tree
        shell: pwsh
        run: ./tools/Test-Repository.ps1

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate release notes
        shell: bash
        run: git cliff --latest --strip header --output release-notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "scripts/Benchmark-CanaryHistorian.ps1" \
            "scripts/Convert-CanaryJsonToCsv.ps1" \
            "scripts/Export-CanaryHistorian.ps1" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
