# git-cliff configuration for canary-historian-tools
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}\\
## [{{ version | trim_start_matches(pat=\"v\") }}] - {{ timestamp | date(format=\"%Y-%m-%d\") }}
{% else %}\\
## [Unreleased]
{% endif %}\\
{% for group, commits in commits | group_by(attribute=\"group\") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/marcelo-6/canary-historian-tools/pull/{{ commit.remote.pr_number }})){% endif %}
{% endfor %}
{% endfor %}\\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/marcelo-6/canary-historian-tools" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🚜 Refactor" },
  { message = "^docs", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^build", group = "📦 Build" },
  { message = "^ci", group = "⚙️ CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "🔧 Miscellaneous" },
  { message = "^revert", group = "◀️ Reverts" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
